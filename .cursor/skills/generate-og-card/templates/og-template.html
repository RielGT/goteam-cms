<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px;
      background: #0f172a; /* PLACEHOLDER: replace with brand bg token */
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }
    .logo { height: 48px; margin-bottom: 40px; object-fit: contain; }
    .headline {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 24px;
      max-width: 900px;
    }
    .description {
      font-size: 28px;
      opacity: 0.75;
      max-width: 800px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  {{#if LOGO_URL}}<img class="logo" src="{{LOGO_URL}}" alt="">{{/if}}
  <div class="headline">{{HEADLINE}}</div>
  <div class="description">{{DESCRIPTION}}</div>
</body>
</html>
